<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Capture fictive d'un journal d'exécution">
  <rect width="1100" height="520" fill="#F6F7FB"/>
  <rect x="40" y="30" width="1020" height="60" rx="10" fill="#2D3561"/>
  <text x="70" y="68" font-family="Arial" font-size="24" fill="#FFFFFF" font-weight="bold">Journal d'exécution · démo fictive</text>
  <text x="70" y="120" font-family="Arial" font-size="18" fill="#2D3561" font-weight="bold">Heure</text>
  <text x="220" y="120" font-family="Arial" font-size="18" fill="#2D3561" font-weight="bold">Workflow</text>
  <text x="700" y="120" font-family="Arial" font-size="18" fill="#2D3561" font-weight="bold">Statut</text>
  <text x="870" y="120" font-family="Arial" font-size="18" fill="#2D3561" font-weight="bold">Durée</text>
  <line x1="70" y1="135" x2="1030" y2="135" stroke="#D9DCE8" stroke-width="2"/>
  <text x="70" y="175" font-family="Arial" font-size="18" fill="#333">09:00</text><text x="220" y="175" font-family="Arial" font-size="18" fill="#333">Veille marchés</text><text x="700" y="175" font-family="Arial" font-size="18" fill="#2E7D32">OK</text><text x="870" y="175" font-family="Arial" font-size="18" fill="#333">1,2 s</text>
  <text x="70" y="215" font-family="Arial" font-size="18" fill="#333">09:05</text><text x="220" y="215" font-family="Arial" font-size="18" fill="#333">Factures fournisseurs</text><text x="700" y="215" font-family="Arial" font-size="18" fill="#2E7D32">OK</text><text x="870" y="215" font-family="Arial" font-size="18" fill="#333">0,8 s</text>
  <text x="70" y="255" font-family="Arial" font-size="18" fill="#333">09:10</text><text x="220" y="255" font-family="Arial" font-size="18" fill="#333">Agent réponse</text><text x="700" y="255" font-family="Arial" font-size="18" fill="#C62828">ERREUR</text><text x="870" y="255" font-family="Arial" font-size="18" fill="#333">2,1 s</text>
  <text x="70" y="295" font-family="Arial" font-size="18" fill="#333">09:15</text><text x="220" y="295" font-family="Arial" font-size="18" fill="#333">Relance automatique</text><text x="700" y="295" font-family="Arial" font-size="18" fill="#2E7D32">OK</text><text x="870" y="295" font-family="Arial" font-size="18" fill="#333">1,5 s</text>
  <rect x="70" y="340" width="960" height="130" rx="10" fill="#FFFFFF" stroke="#D9DCE8"/>
  <text x="95" y="375" font-family="Arial" font-size="18" fill="#2D3561" font-weight="bold">Dernier incident</text>
  <text x="95" y="405" font-family="Arial" font-size="16" fill="#333">09:10 · Agent réponse · délai dépassé sur l'API</text>
  <text x="95" y="432" font-family="Arial" font-size="16" fill="#333">Action : relance automatique, alerte envoyée, journal mis à jour.</text>
  <text x="95" y="459" font-family="Arial" font-size="14" fill="#666">Données fictives. Aucune donnée client.</text>
</svg>
